# An oops should kill the offending task and leave a trace in the journal,
# never reboot the box. NOTE: kubelet and kdump-config both re-arm these at
# runtime; panic-guard.service is the enforcement that actually holds.
kernel.panic_on_oops = 0
kernel.panic = 0
kernel.hung_task_panic = 0
kernel.softlockup_panic = 0
