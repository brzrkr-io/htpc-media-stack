[Service]
# Belt-and-suspenders alongside panic-guard.service: kubelet sets
# kernel.panic_on_oops=1 + kernel.panic=10 during startup; undo it right after
# k3s reports ready. panic-guard catches any later re-arming within 2s.
ExecStartPost=/bin/sh -c 'sleep 15; /usr/sbin/sysctl -q -w kernel.panic_on_oops=0 kernel.panic=0 || true'
