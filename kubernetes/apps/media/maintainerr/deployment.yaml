---
# Maintainerr - Automated media cleanup and collection management
# Manages Plex/Jellyfin libraries with rule-based content removal
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintainerr
  namespace: media
  labels:
    app: maintainerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maintainerr
  template:
    metadata:
      labels:
        app: maintainerr
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # Only crawl the tree when ownership is actually wrong
          command: ["sh", "-c", "[ \"$(stat -c %u /opt/data)\" = \"1000\" ] || chown -R 1000:1000 /opt/data"]
          volumeMounts:
            - name: config
              mountPath: /opt/data
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "200m"
      containers:
        - name: maintainerr
          image: ghcr.io/jorenn92/maintainerr:latest@sha256:bee84707edaf589cda3d18b6813cbfe3a137b52786210c3a28190e10910c1240
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/Chicago"
          ports:
            - containerPort: 6246
              name: web
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /opt/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /
              port: 6246
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 6246
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 6246
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: config
          hostPath:
            path: /data/media/config/maintainerr
            type: DirectoryOrCreate
