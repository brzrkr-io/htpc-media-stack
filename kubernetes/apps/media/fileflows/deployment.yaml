---
# FileFlows - Automated media transcoding and file processing
# Uses AMD Radeon 680M GPU via VA-API for hardware-accelerated transcoding
# Replaces Tdarr - fully free, no paid tier
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileflows
  namespace: media
  labels:
    app: fileflows
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fileflows
  template:
    metadata:
      labels:
        app: fileflows
    spec:
      # VA-API hardware transcoding via render/video groups instead of privileged:true
      securityContext:
        supplementalGroups:
          - 44   # video  -> /dev/dri/card1
          - 991  # render -> /dev/dri/renderD128 (AMD Radeon 680M, VA-API)
      containers:
        - name: fileflows
          image: revenz/fileflows:latest@sha256:11780594eaa3e655b65572918cf16bff007060d16aa23d71fe78833871887290
          imagePullPolicy: IfNotPresent
          # ffmpeg install must NOT be fatal: at boot the network is often not
          # ready yet, and the old '&&' chain crash-looped the container with a
          # fresh ~200MB apt download on every retry.
          command: ["bash", "-c", "if apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null 2>&1; then ln -sf /usr/bin/ffmpeg /usr/local/bin/ffmpeg; ln -sf /usr/bin/ffprobe /usr/local/bin/ffprobe; else echo 'WARN: ffmpeg apt install failed; using image-bundled ffmpeg'; fi; exec /app/docker-entrypoint.sh"]
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 5000
              name: web
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/Data
            - name: logs
              mountPath: /app/Logs
            - name: temp
              mountPath: /temp
            - name: movies
              mountPath: /media/movies
            - name: tv
              mountPath: /media/tv
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "3000m"
          # Startup probe covers the apt-get ffmpeg install + app boot (up to
          # 7 min) so the liveness probe can never kill it mid-install.
          startupProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 42
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: config
          hostPath:
            path: /data/media/config/fileflows/data
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /data/media/config/fileflows/logs
            type: DirectoryOrCreate
        - name: temp
          hostPath:
            path: /data/media/config/fileflows/temp
            type: DirectoryOrCreate
        - name: movies
          hostPath:
            path: /data/media/local-media/library/movies
            type: Directory
        - name: tv
          hostPath:
            path: /data/media/local-media/library/tv
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
