---
# CronJob to monitor FlareSolverr health inside the gluetun-transmission pod
# FlareSolverr runs as a sidecar sharing the gluetun network namespace,
# so we cannot add standard Kubernetes probes directly to it.
# This CronJob pings the FlareSolverr endpoint every 5 minutes and
# restarts the pod if FlareSolverr is unresponsive.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flaresolverr-healthcheck
  namespace: downloads
  labels:
    app: flaresolverr-healthcheck
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        spec:
          serviceAccountName: flaresolverr-healthcheck
          restartPolicy: Never
          containers:
            - name: healthcheck
              image: curlimages/curl:latest@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  # Deep health check with restart hysteresis: never restart a pod
                  # younger than 10 min (post-reboot VPN/Chromium startup), and
                  # require two consecutive failed checks before restarting.
                  APISERVER=https://kubernetes.default.svc
                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  DEPLOY="$APISERVER/apis/apps/v1/namespaces/downloads/deployments/gluetun-transmission"
                  kapi() { curl -sf --cacert $CACERT -H "Authorization: Bearer $TOKEN" "$@"; }

                  if curl -sf --max-time 10 http://flaresolverr.downloads.svc.cluster.local:8191/ >/dev/null 2>&1; then
                    echo "FlareSolverr is healthy"
                    kapi -X PATCH -H "Content-Type: application/merge-patch+json" "$DEPLOY" \
                      -d '{"metadata":{"annotations":{"healthcheck.brzrkr.io/strikes":null}}}' >/dev/null
                    exit 0
                  fi
                  echo "FlareSolverr is NOT responding"

                  # NB: the apiserver pretty-prints JSON for curl User-Agents,
                  # so tolerate optional whitespace after the colon
                  START=$(kapi "$APISERVER/api/v1/namespaces/downloads/pods?labelSelector=app%3Dgluetun-transmission" \
                    | grep -o '"startTime": *"[^"]*"' | head -1 | cut -d'"' -f4)
                  if [ -n "$START" ]; then
                    AGE=$(( $(date -u +%s) - $(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$START" +%s) ))
                    if [ "$AGE" -lt 600 ]; then
                      echo "Pod is only ${AGE}s old - still starting, skipping restart"
                      exit 0
                    fi
                  fi

                  STRIKES=$(kapi "$DEPLOY" | grep -o '"healthcheck.brzrkr.io/strikes": *"[^"]*"' | cut -d'"' -f4)
                  if [ "$STRIKES" != "1" ]; then
                    echo "First failure - recording strike, no restart yet"
                    kapi -X PATCH -H "Content-Type: application/merge-patch+json" "$DEPLOY" \
                      -d '{"metadata":{"annotations":{"healthcheck.brzrkr.io/strikes":"1"}}}' >/dev/null
                    exit 1
                  fi

                  echo "Second consecutive failure - restarting gluetun-transmission"
                  kapi -X PATCH -H "Content-Type: application/merge-patch+json" "$DEPLOY" \
                    -d '{"metadata":{"annotations":{"healthcheck.brzrkr.io/strikes":null}},"spec":{"template":{"metadata":{"annotations":{"kubectl.kubernetes.io/restartedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}}}}}'
                  exit 1
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
                limits:
                  memory: "32Mi"
                  cpu: "50m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flaresolverr-healthcheck
  namespace: downloads
  labels:
    app: flaresolverr-healthcheck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flaresolverr-healthcheck
  namespace: downloads
  labels:
    app: flaresolverr-healthcheck
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["gluetun-transmission"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flaresolverr-healthcheck
  namespace: downloads
  labels:
    app: flaresolverr-healthcheck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flaresolverr-healthcheck
subjects:
  - kind: ServiceAccount
    name: flaresolverr-healthcheck
    namespace: downloads
